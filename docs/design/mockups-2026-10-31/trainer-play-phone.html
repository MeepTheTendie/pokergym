<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><style>
.table{position:relative;border-radius:36px;background:radial-gradient(ellipse at 50% 45%,#2a5a45,#123024 72%);box-shadow:inset 0 0 0 10px #0d241b,inset 0 0 0 11px rgba(235,208,124,.25),inset 0 40px 100px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.lbl{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:14px}
.lbl b{color:var(--cream);font-weight:600;letter-spacing:.06em;font-size:15px;text-transform:none;margin-left:8px}
.row{display:flex;gap:16px;justify-content:center}
.arc{font-family:Fraunces;font-style:italic;color:rgba(235,208,124,.45);font-size:15px;letter-spacing:.04em}
.acts{display:flex;gap:12px}.acts .btn.dis{opacity:.35}

.wrap{padding:16px;height:844px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center}.top .display{font-size:22px}
.table{flex:1;padding:34px 24px 28px;border-radius:28px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.acts .btn{height:48px}
.coach{padding:16px}.coach img{width:36px;height:36px}.coach p{font-size:16px}
</style></head><body><div class="wrap"><div class="top"><div class="logo"><img src="mascot.png" alt="Poker Gym mascot">Play Poker Gym</div><span class="display">2/2</span></div>
<div class="table"><div><div class="lbl">Dealer <b>shows 5</b></div><div class="row"><div class="card r" style="--w:100px"><div class="c tl">5<span>♦︎</span></div><div class="pip">♦︎</div><div class="c br">5<span>♦︎</span></div></div><div class="card back" style="--w:100px"></div></div></div>
<div><div class="row"><div class="card" style="--w:100px"><div class="c tl">A<span>♠︎</span></div><div class="pip">♠︎</div><div class="c br">A<span>♠︎</span></div></div><div class="card r" style="--w:100px"><div class="c tl">4<span>♥︎</span></div><div class="pip">♥︎</div><div class="c br">4<span>♥︎</span></div></div></div><div class="lbl" style="margin-top:14px">You <b>soft 15</b></div></div>
<div class="acts"><span class="btn">Hit</span><span class="btn">Stand</span><span class="btn">Double</span><span class="btn dis">Split</span></div></div>
<div class="panel coach"><img src="mascot.png" alt="Poker Gym mascot"><p>Soft 15 against a 5. Which card is the dealer most likely to bust with?</p></div></div></body></html>
