name: deploy

# Deploys playpokergym.com after the `tests` workflow passes on main
# (OPERATING_RULES 4: deploy only from a merged, green main). The Cloudflare
# token lives only in this repo's Actions secrets; no agent holds it.
# Owner approval: Wes, 2026-11-06 ("go nuts", after the auto-deploy proposal).
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip until Cloudflare secrets are set
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set yet; skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '24'
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        run: npm run deploy 2>&1 | tee deploy.log
      - name: Live check
        if: steps.gate.outputs.ready == 'true'
        run: |
          sleep 10
          for path in / /web/ /guides/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://playpokergym.com$path")
            echo "$path $code"
            [ "$code" = "200" ] || exit 1
          done
          {
            echo "### Deployed"
            echo "- Commit: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- Worker version: \`$(grep -oiE 'version id: *[0-9a-f-]+' deploy.log | awk '{print $NF}' | tail -1)\`"
            echo "- Live check: /, /web/, /guides/ all 200"
          } >> "$GITHUB_STEP_SUMMARY"
