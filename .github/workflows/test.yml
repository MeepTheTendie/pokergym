name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Provide chromium on PATH
        run: |
          sudo ln -sf "$(command -v google-chrome)" /usr/local/bin/chromium
          chromium --version
      - name: Full test suite (unit + release + browser checks)
        run: npm run test:all
      - name: Install Bend
        run: curl -fsSL https://bend-lang.com/install.sh | sh
      - name: Verify Bend reference
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          export BEND_NO_TELEMETRY=1
          npm run bend:check
          npm run bend:verify
          npm run bend:verify:vp
          npm run bend:proofs
